# One origin for the SPA and the API, so the session cookie is first-party
# and SameSite=Strict holds.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 512m;   # bulk uploads

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location ~ ^/(auth|users|tenants|api-keys|leaks|watchlist|sources|recon|yara|notifications|ai|system|intel|surface|vulns|brand|ransomware|domains|report|api)(/|$) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        # Server-Sent Events from /ai/chat must not be buffered.
        proxy_buffering off;
        proxy_cache off;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
