# Round-robin TCP balancer in front of the Tor pool. `server-template` asks
# Docker's DNS for every replica of the `tor` service and re-resolves, so
# scaling with `docker compose up --scale tor=N` needs no config change.
global
    log stdout format raw local0
    maxconn 2000

defaults
    mode tcp
    log global
    timeout connect 15s
    timeout client 180s
    timeout server 180s

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s

frontend socks
    bind *:9050
    default_backend tor_pool

backend tor_pool
    balance roundrobin
    option tcp-check
    server-template tor 10 tor:9050 check resolvers docker init-addr none
